# Pages CMS (https://app.pagescms.org): forms for content/menu.json and content/settings.json,
# labelled in Georgian and English.
# Every save is a commit on main, which republishes the site. A mistake stops the
# publish and the live site keeps its previous version (see content/README.md).

media:
  input: content/photos
  output: /photos

components:
  text:
    type: object
    fields:
      - { name: ka, label: ქართული · Georgian, type: string }
      - { name: en, label: ინგლისური · English, type: string }
      - { name: ru, label: რუსული · Russian, type: string }
  longText:
    type: object
    fields:
      - { name: ka, label: ქართული · Georgian, type: text }
      - { name: en, label: ინგლისური · English, type: text }
      - { name: ru, label: რუსული · Russian, type: text }
  day:
    type: object
    fields:
      - { name: closed, label: მთელი დღე დაკეტილია · Closed all day, type: boolean }
      - { name: open, label: 'იხსნება · Opens (10:00)', type: string, pattern: '^(([01]\d|2[0-3]):[0-5]\d)?$' }
      - { name: close, label: 'იკეტება · Closes (22:00)', type: string, pattern: '^(([01]\d|2[0-3]):[0-5]\d)?$' }
  bank:
    type: object
    fields:
      - name: enabled
        label: ჩართულია · Enabled
        description: 'გამორთული = ეს გადარიცხვა საიტზე არ ჩანს · Off = this transfer option is not offered on the site.'
        type: boolean
        default: true
      - { name: iban, label: IBAN, type: string }
      - { name: holder, label: ანგარიშის მფლობელი · Account holder, type: string }

content:
  - name: menu
    label: მენიუ · Menu
    type: file
    path: content/menu.json
    format: json
    fields:
      - name: categories
        label: კატეგორიები · Categories
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.name.ka}'
        fields:
          - { name: name, label: კატეგორიის სახელი · Category name, component: text }
          - name: orderable
            label: ონლაინ შეკვეთა · Can be ordered online
            description: 'გამორთული = მხოლოდ კაფეში (მაგ. ყავა, ჩაი), ფასი ჩანს ინფორმაციისთვის · Off = served at the café only, price shown for information.'
            type: boolean
            default: true
          - name: items
            label: კერძები · Dishes
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{fields.name.ka} · {fields.price} ₾'
            fields:
              - { name: name, label: სახელი · Name, component: text }
              - { name: description, label: აღწერა · Description, component: longText }
              - { name: price, label: ფასი · Price (₾), type: number }
              - name: promoPrice
                label: აქციის ფასი · Promo price (₾)
                description: 'ფასზე ნაკლები. ცარიელი = აქცია არ არის · Lower than the price. Empty = no promo.'
                type: number
              - name: photo
                label: ფოტო · Photo
                type: image
                options:
                  extensions: [jpg, jpeg, png, webp]
              - name: available
                label: ხელმისაწვდომია · Available
                description: 'გამორთული = ნაცრისფრად ჩანს, დროებით მიუწვდომელია · Off = greyed out, temporarily unavailable.'
                type: boolean
                default: true
              - name: hidden
                label: დამალული · Hidden
                description: 'ჩართული = საიტზე არ ჩანს, აქ რჩება მოგვიანებისთვის · On = removed from the site, kept here for later.'
                type: boolean
              - name: id
                label: ტექნიკური id · Technical id
                description: 'არ შეცვალოთ · Leave as it is.'
                type: string
                hidden: true

  - name: settings
    label: პარამეტრები · Settings
    type: file
    path: content/settings.json
    format: json
    fields:
      - { name: name, label: კაფეს სახელი · Café name, type: string, required: true }
      - name: gallery
        label: ზედა სურათები · Pictures at the top
        description: 'პირველი ჩანს პირველად, დანარჩენი გადაფურცვლით · The first shows first, the others when swiping.'
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{fields.image}'
        fields:
          - name: image
            label: სურათი · Picture
            type: image
            options:
              extensions: [jpg, jpeg, png, webp]
          - { name: alt, label: 'სურათის აღწერა (უსინათლოებისთვის) · Description (for blind visitors)', component: text }
      - name: whatsapp
        label: WhatsApp-ის ნომერი · WhatsApp number
        description: 'ქვეყნის კოდით, მაგ. +995 593 62 80 90. შეკვეთები აქ მოდის · With country code. Orders arrive here.'
        type: string
        required: true
      - name: openingHours
        label: სამუშაო საათები · Opening hours (Tbilisi time)
        type: object
        fields:
          - { name: monday, label: ორშაბათი · Monday, component: day }
          - { name: tuesday, label: სამშაბათი · Tuesday, component: day }
          - { name: wednesday, label: ოთხშაბათი · Wednesday, component: day }
          - { name: thursday, label: ხუთშაბათი · Thursday, component: day }
          - { name: friday, label: პარასკევი · Friday, component: day }
          - { name: saturday, label: შაბათი · Saturday, component: day }
          - { name: sunday, label: კვირა · Sunday, component: day }
      - { name: address, label: მისამართი · Address, component: text }
      - name: location
        label: რუკაზე მდებარეობა · Map pin
        description: 'Google Maps-დან: დააჭირეთ ადგილს და დააკოპირეთ ორი რიცხვი · From Google Maps: long-press the place, copy the two numbers.'
        type: object
        fields:
          - { name: lat, label: განედი · Latitude, type: number }
          - { name: lng, label: გრძედი · Longitude, type: number }
      - { name: facebook, label: Facebook-ის გვერდის ბმული · Facebook page link, type: string }
      - name: bankAccounts
        label: საბანკო ანგარიშები · Bank accounts
        type: object
        fields:
          - { name: bog, label: საქართველოს ბანკი · Bank of Georgia, component: bank }
          - { name: tbc, label: თიბისი ბანკი · TBC Bank, component: bank }
